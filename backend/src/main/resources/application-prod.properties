# =============================================
# ShopSphere - Production Configuration
# =============================================

# Server
server.port=${PORT:8080}

# MySQL Database (Railway / PlanetScale / Aiven free MySQL)
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/shopsphere_db?createDatabaseIfNotExist=true&useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
app.jwt.secret=${JWT_SECRET:ShopSphereSecretKeyForJWTAuthenticationThatIsLongEnoughToBeSecure2024!@#$%}
app.jwt.expiration-ms=86400000

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# CORS - Allow frontend domain
app.cors.allowed-origins=${CORS_ORIGINS:https://shopsphere-ecommerce.vercel.app,http://localhost:5173}

# Logging
logging.level.com.shopsphere=INFO
logging.level.org.springframework.security=WARN
